<main class="iconsContainerBar">
    <div class="d-flex iconsBar">
        <img class="w-100" src="assets/logo.png" alt="logo">
        @for (icon of icons; track $index) {
        <mat-icon aria-hidden="false" class="iconUnused" [fontIcon]="icon"
            [class.selectedIcon]="activeIndex === $index" (click)="setActive($index)">
        </mat-icon>
        <!-- <i class="{{ icon }}" [class.selectedIcon]="(activeIndex === $index)" (click)="setActive($index)"></i> -->
        }
    </div>
    <div class="d-flex">
        <mat-icon aria-hidden="false" class="logOutIcon" fontIcon="logout"></mat-icon>
    </div>
</main>
